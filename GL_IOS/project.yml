# XcodeGen 스펙 — `xcodegen generate` 실행 시 GL_IOS.xcodeproj 생성
# (생성된 .xcodeproj 를 git 에 커밋하므로, 이후 xcodegen 없이도 빌드 가능)
name: GL_IOS
options:
  bundleIdPrefix: com.gatcha.log
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    # Xcode 15+ 스크립트 샌드박스가 Gradle 실행을 막으므로 비활성화
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Swift 6 언어 모드 — 액터 격리 위반을 **경고가 아니라 에러**로 잡는다.
    # 5 모드에선 "메인 스레드 밖에서 디코딩한다"고 적어둔 코드가 실제로는 메인으로 돌아오는
    # 위반이 경고로만 떠서 오래 방치됐다(RemoteImage.downsample). 컴파일러가 막게 한다.
    SWIFT_VERSION: "6.0"

# ── 외부 패키지 (SPM) ─────────────────────────────────────────────
# Firebase iOS SDK: GitLive(Kotlin) firebase-auth/firestore 가 런타임에 사용하는 네이티브 SDK
# (구글 로그인은 GoogleSignIn SDK 제거 → ASWebAuthenticationSession 웹 OAuth 로 전환, GoogleWebOAuth.swift)
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 12.0.0

targets:
  GL_IOS:
    type: application
    platform: iOS
    sources:
      - GL_IOS
    # 키체인 entitlement — Firebase Auth 인증 상태·구글 로그인 토큰·HoYoLAB 토큰(Keychain) 저장에 필수.
    # 이게 없으면 SecItem* 호출이 -34018(errSecMissingEntitlement)로 실패한다.
    entitlements:
      path: GL_IOS/GL_IOS.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.gatcha.log.ios"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: GL_IOS/Info.plist
      properties:
        CFBundleDisplayName: Gatcha Log
        # 한국어 전용 앱 — 지원 언어를 선언하지 않으면 **시스템 UI 문자열이 영어로 떨어진다**
        # (텍스트 선택 시 뜨는 복사·전체 선택 메뉴, 사진 권한 시트 등 UIKit 기본 UI).
        # 기본값 $(DEVELOPMENT_LANGUAGE) 는 영어라, 한국어를 개발 지역·지원 언어로 못박는다.
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations:
          - ko
        # 앱 버전 — Android(app/build.gradle.kts)와 동일한 규칙: versionName "27.33.0" / versionCode 273300
        CFBundleShortVersionString: "27.42.0"
        CFBundleVersion: "274200"
        # Compose Multiplatform 필수 — 없으면 시작 시 PlistSanityCheck 크래시 (120Hz 허용)
        CADisableMinimumFrameDurationOnPhone: true
        # 런치스크린(v27.38.0) — 예전엔 빈 dict 라 실행 직후 아무것도 없는 흰 화면이 떴다.
        # 화이트 바탕 + 아이콘의 게이지 링 마크(민트 글로우는 PNG 에 구워 넣음 — GL_IOS/scripts/GenLaunchMark.swift).
        # 앱 첫 화면(온보딩·로딩)의 BrandGround 와 같은 그라운드라 이음매 없이 넘어간다.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        # iPhone = 세로 전용(모바일 UX). iPad = 전방향(가로 지원) — ContentView 가 iPad 에서
        # NavigationSplitView 사이드바 레이아웃으로 전환한다(ContentView.iPadSplit).
        # 전체화면 필요 선언 유지 → iPad 멀티태스킹(Split View/Slide Over) 대신 회전만 허용.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # 공지 본문 이미지 저장(추가 전용) — 문구가 없으면 저장 시도 순간 크래시한다.
        NSPhotoLibraryAddUsageDescription: 공지 이미지를 사진 앱에 저장하기 위해 사용해요.
        # 전역 글꼴 Pretendard (GL_IOS/Fonts/*.otf 번들)
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
        # ── 구글 로그인 (웹 OAuth) — ASWebAuthenticationSession 리다이렉트 콜백 스킴 ──
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.711708512022-6upq632okh78jru6q09o2dol4tekokbn
        # ── 자동 출석 백그라운드 (BGTaskScheduler) ──
        BGTaskSchedulerPermittedIdentifiers:
          - com.gatcha.log.ios.checkin
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatcha.log.ios
        PRODUCT_NAME: Gatcha-Log
        # 앱 아이콘 (Assets.xcassets/AppIcon) — Android 앱과 동일한 위시스타 아이콘
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Intel 시뮬레이터(x86_64) 제외 — Kotlin 타깃이 iosSimulatorArm64(애플 실리콘)만 구성됨.
        # 없으면 Release 시뮬레이터 빌드가 "Unknown iOS simulator arch: 'x86_64'" 로 실패.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # GL_Shared Gradle 빌드가 떨궈 주는 framework 위치
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../GL_Shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # -ObjC: Firebase 정적 라이브러리의 ObjC 카테고리 로드에 필요
        OTHER_LDFLAGS: "$(inherited) -framework Shared -ObjC"
        # 자동 서명 (Personal Team) — 시뮬레이터·실기기 모두 동작 + 키체인 entitlement 활성화.
        # 키체인은 Firebase Auth 인증 상태·구글 로그인 토큰·HoYoLAB 토큰 저장에 필수.
        # 무료 개인 팀: 앱 7일 유효(만료 시 재설치), App Store 배포 시 유료 계정으로 전환.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CCTT9CBG38
        CODE_SIGN_IDENTITY: "Apple Development"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          # JAVA_HOME 폴백 — 로컬 Xcode GUI 빌드는 Android Studio JBR,
          # CI(GitHub Actions)·CLI 빌드는 이미 설정된 JAVA_HOME 을 그대로 사용
          if [ ! -d "${JAVA_HOME:-/nonexistent}" ]; then
            export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          fi
          cd "$SRCROOT/.."
          ./gradlew :GL_Shared:embedAndSignAppleFrameworkForXcode

  # 성능 측정 전용 UI 테스트 타깃 — 콜드 런치 실측(XCTApplicationLaunchMetric).
  # 기능 테스트용이 아니다. 이 프로젝트엔 테스트 타깃이 아예 없어서 성능 1·2라운드가
  # 전부 코드 판독으로만 진행됐고, 그래서 진단이 어긋난 전례가 있다.
  # 실행은 실기기·Release 로: LaunchBenchmark.swift 주석 참고.
  GL_IOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GL_IOSUITests
    dependencies:
      - target: GL_IOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gatcha.log.ios.uitests
        TEST_TARGET_NAME: GL_IOS
        # 앱 타깃은 Info.plist 파일을 직접 두지만(위 info:), 테스트 번들은 관리할 내용이 없다.
        # 이걸 켜지 않으면 "target does not have an Info.plist file" 로 코드 서명이 실패한다.
        GENERATE_INFOPLIST_FILE: "YES"
        # 앱 타깃과 같은 개인 팀으로 서명 — 러너 앱도 기기에 설치돼야 한다.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CCTT9CBG38

# 공유 스킴 — `xcodebuild -scheme GL_IOS` / 아카이브(build-ipa.sh) 용. xcodegen 재생성 후에도 유지.
schemes:
  GL_IOS:
    build:
      targets:
        GL_IOS: all
    run:
      config: Debug
    # 성능 측정은 Release 로 잰다 — Debug 는 최적화가 꺼져 있어 비용이 과장된다.
    test:
      config: Release
      targets:
        - GL_IOSUITests
    archive:
      config: Release
