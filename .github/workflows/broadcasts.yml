name: Broadcasts

# 공식 한국 채널의 **예약된 라이브**를 6시간마다 훑어 broadcasts.json 에 떠 둔다.
# 앱은 이 JSON 만 읽는다 — YouTube API 키를 앱에 심을 수 없고(사이드로드), 무엇보다
# search.list 할당량이 프로젝트당 하루 10,000 units 라 앱이 직접 부르면 즉시 소진된다.
# 자세한 사정은 .github/scripts/fetch-broadcasts.mjs 머리말 참고.
on:
  schedule:
    # 6시간마다(UTC). 방송 예고는 며칠 전에 올라오므로 이 정도 지연은 무해하다.
    # 쿼터는 실행당 약 301 units × 4회 = 하루 1,204 units (한도의 12%).
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: broadcasts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # JSON 을 main 에 되커밋해야 한다.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Fetch upcoming broadcasts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node .github/scripts/fetch-broadcasts.mjs

      # 스크립트가 내용이 바뀔 때만 파일을 쓴다 — 그래서 여기 diff 가 비면 커밋도 없다.
      - name: Commit if changed
        run: |
          if git diff --quiet -- broadcasts.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broadcasts.json
          git commit -m "chore(broadcasts): 예약된 특별 방송 일정을 갱신한다"
          git push
