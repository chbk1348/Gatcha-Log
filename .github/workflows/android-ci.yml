name: Android CI

# PR·main push 마다 공유 로직 테스트 + Android 컴파일을 강제한다.
# (릴리즈 컴파일 실패가 main 에 머지된 적이 있어 도입 — 커밋 159f20b 참고)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 이 워크플로는 저장소를 읽기만 한다 — 토큰 권한을 기본값에 맡기지 않는다(27.51.1).
# 액션은 태그가 아니라 커밋 해시로 고정한다(태그는 주인이 옮길 수 있다). 올릴 때는 해시와 주석의 태그를 같이 바꾼다.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # version.json 은 OTA 소스다 — 깨진 채 main 에 있으면 전 Android 사용자의 업데이트가 멈춘다.
  # 로컬 훅과 **같은 스크립트**로 저장소의 파일을 검사한다. 어드민이 API 로 올린 커밋도 여기서 걸린다.
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check version.json
        run: sh .githooks/check-version-json.sh --file version.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Gradle 데몬 JVM 기준(gradle/gradle-daemon-jvm.properties = Temurin 24)과 같은 JDK 를 깐다.
      # 없으면 Gradle 이 foojay 에서 받으려 하는데, 고정된 다운로드 주소가 400 을 돌려줘 빌드가 멈췄다(2026-10-09).
      - name: Set up JDK 24
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '24'

      # v5 에 묶어 둔다 — v6 부터 캐싱이 proprietary `gradle-actions-caching` 로 분리되어
      # Gradle Terms of Use 동의가 전제된다(MIT 아님). v5 도 Node 24 라 deprecation 은 없다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      # commonMain 공통 로직 테스트 (KeyStatRules·Format·Md5).
      # Gatcha Log Shared android 타겟의 withHostTest {} 로 JVM 호스트에서 실행된다.
      - name: Shared unit tests
        run: ./gradlew ":Gatcha Log Shared:testAndroidHostTest"

      # 릴리즈 컴파일 — R8/Compose 릴리즈 경로에서만 드러나는 컴파일 에러를 여기서 잡는다.
      # (서명은 필요 없다: compile 태스크는 signingConfig 를 타지 않음)
      - name: Compile release Kotlin
        run: ./gradlew ":Gatcha Log Android:compileReleaseKotlin"

      - name: Assemble debug APK
        run: ./gradlew ":Gatcha Log Android:assembleDebug"

      - name: Lint
        run: ./gradlew ":Gatcha Log Android:lintDebug"

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            Gatcha Log Shared/build/reports/tests/**
            Gatcha Log Android/build/reports/lint-results-*.html
          if-no-files-found: ignore
