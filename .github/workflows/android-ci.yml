name: Android CI

# PR·main push 마다 공유 로직 테스트 + Android 컴파일을 강제한다.
# (릴리즈 컴파일 실패가 main 에 머지된 적이 있어 도입 — 커밋 159f20b 참고)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v5 에 묶어 둔다 — v6 부터 캐싱이 proprietary `gradle-actions-caching` 로 분리되어
      # Gradle Terms of Use 동의가 전제된다(MIT 아님). v5 도 Node 24 라 deprecation 은 없다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # commonMain 공통 로직 테스트 (KeyStatRules·Format·Md5).
      # Gatcha Log Shared android 타겟의 withHostTest {} 로 JVM 호스트에서 실행된다.
      - name: Shared unit tests
        run: ./gradlew ":Gatcha Log Shared:testAndroidHostTest"

      # 릴리즈 컴파일 — R8/Compose 릴리즈 경로에서만 드러나는 컴파일 에러를 여기서 잡는다.
      # (서명은 필요 없다: compile 태스크는 signingConfig 를 타지 않음)
      - name: Compile release Kotlin
        run: ./gradlew ":Gatcha Log Android:compileReleaseKotlin"

      - name: Assemble debug APK
        run: ./gradlew ":Gatcha Log Android:assembleDebug"

      - name: Lint
        run: ./gradlew ":Gatcha Log Android:lintDebug"

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            Gatcha Log Shared/build/reports/tests/**
            Gatcha Log Android/build/reports/lint-results-*.html
          if-no-files-found: ignore
