# ============================================================
# iOS 미서명 IPA 클라우드 빌드 (GitHub Actions macOS 러너)
#
# Windows 작업 라인에서도 IPA를 뽑을 수 있게 하는 워크플로.
# 수동 트리거(workflow_dispatch) 전용 — gh CLI 또는 Actions 탭에서 실행:
#   gh workflow run build-ipa.yml
#   gh run download <run-id>   # 완료 후 IPA 아티팩트 다운로드
#
# 산출물: Gatcha-Log-<버전>.ipa (미서명 — AltStore/Sideloadly 등으로 사용자가 재서명)
# ============================================================
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    # macos-latest(= macOS 26 arm64)의 최신 Xcode 는 26.6 이라 iOS 27 SDK 가 없다.
    # iOS 27 SDK 가 있는 러너는 현재 public preview 인 `xcode-27` 이미지뿐이다.
    # 참고: actions/runner-images#14404 · 정식 이미지에 27 이 들어오면 macos-latest 로 되돌린다.
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ContentView.swift 의 '추가' 버튼이 TabRole.prominent 를 쓰는데 이 심볼은
      # iOS 27 SDK 에만 있다(#available 로 감싸도 컴파일에는 심볼이 필요).
      # 러너 이미지에 27 SDK 가 없으면 30분짜리 Kotlin 빌드를 돌린 뒤에야 깨지므로
      # 여기서 먼저 확인하고 끊는다. 실제 선택은 build-ipa.sh 가 DEVELOPER_DIR 로 한다.
      - name: Verify iOS 27 SDK is available
        run: |
          echo "── 러너에 설치된 Xcode ──"
          FOUND=""
          for app in /Applications/Xcode*.app; do
            VER=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | head -1)
            SDKS=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -showsdks 2>/dev/null \
                     | grep -o 'iphoneos[0-9.]*' | tr '\n' ' ')
            echo "  $app — $VER — SDK: ${SDKS:-none}"
            case "$SDKS" in *iphoneos27.0*) FOUND="$app" ;; esac
          done
          if [ -z "$FOUND" ]; then
            echo "::error::iOS 27.0 SDK 를 가진 Xcode 가 러너에 없습니다. macos 러너 이미지 갱신 대기 또는 self-hosted 필요."
            exit 1
          fi
          echo "✅ iOS 27.0 SDK: $FOUND"

      # Kotlin 프레임워크(embedAndSignAppleFrameworkForXcode) 빌드용 JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Xcode 스크립트 페이즈의 JAVA_HOME 폴백 경로(Android Studio JBR)가 CI 에도
      # 실존하도록 심볼릭 링크 — 환경변수 전파가 안 되는 경우의 이중 안전망
      - name: Link JDK to Android Studio JBR path
        run: |
          sudo mkdir -p "/Applications/Android Studio.app/Contents/jbr/Contents"
          sudo ln -sfn "$JAVA_HOME" "/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          ls -la "/Applications/Android Studio.app/Contents/jbr/Contents/"

      # Gradle 의존성 + Kotlin/Native(konan) 툴체인 캐시 — 재빌드 시간 단축
      - name: Cache Gradle & Kotlin/Native
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-konan-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-konan-

      - name: Build unsigned IPA
        working-directory: "Gatcha Log IOS"
        run: bash build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gatcha-Log-IPA
          path: "Gatcha Log IOS/build/*.ipa"
          if-no-files-found: error
          retention-days: 30
