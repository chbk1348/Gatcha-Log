<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatcha Log Admin</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">GL</span>
    <div>
      <strong>Gatcha Log</strong>
      <small>운영 어드민</small>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="sidebar-foot">
    <div id="source-label" class="muted">불러온 소스 없음</div>
  </div>
</aside>

<header class="topbar">
  <div>
    <h1 id="page-title">대시보드</h1>
    <p id="page-desc" class="muted"></p>
  </div>
  <div class="topbar-actions">
    <span id="dirty" class="badge badge-clean">변경 없음</span>
    <span id="who" class="badge badge-clean" hidden></span>
    <button id="btn-load-remote" class="btn">불러오기</button>
    <label class="btn" for="file-input">파일 열기</label>
    <input id="file-input" type="file" accept=".json,application/json" hidden>
    <button id="btn-export" class="btn">내보내기</button>
    <button id="btn-publish" class="btn btn-primary">라이브 반영</button>
  </div>
</header>

<main id="main"></main>

<div id="toast" class="toast" hidden></div>

<script src="firebase-config.js"></script>
<script type="module" src="cloud.js"></script>
<script src="ui.js" defer></script>
<script src="admin.js" defer></script>
</body>
</html>
